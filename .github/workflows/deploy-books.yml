# Builds both language editions and deploys to GitHub Pages:
#   English (canonical) -> https://xinli95.github.io/Multimodal-101/
#   Chinese             -> https://xinli95.github.io/Multimodal-101/zh/
# Custom workflow because TeachBooks/deploy-book-workflow only supports a single book/ dir.

name: deploy-books

on:
  push:
    branches: [main]
    paths:
      - book/**
      - book-zh/**
      - requirements.txt
      - .github/workflows/deploy-books.yml
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build toolchain
        run: pip install -r requirements.txt

      - name: Build both books
        run: |
          teachbooks build book
          teachbooks build book-zh

      - name: Assemble site (en at root, zh under /zh)
        run: |
          mkdir -p site/zh
          cp -r book/_build/html/. site/
          cp -r book-zh/_build/html/. site/zh/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
